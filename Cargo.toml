[package]
name = "rusty-kv"
version = "0.1.0"
edition = "2024"

[dependencies]
byteorder = "1.5.0"
bytes = "1.11.1"
crc32fast = "1.5.0"
rand = "0.9.2"
snafu = { version = "0.9.2", features = ["std", "backtraces-impl-backtrace-crate", "backtrace"] }
thiserror = "2.0.18"
xxhash-rust = { version = "0.8.15", features = ["xxh3", "const_xxh3"] }

[dev-dependencies]
criterion = "0.8.2"
rstest = "0.27.0"
tempfile = "3.26.0"

[features]
__internal_whitebox = []

[[bench]]
name = "wal_bench"
harness = false
required-features = ["__internal_whitebox"]
